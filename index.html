<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Campos do Jordão 06–08/11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --line:#dde3dc; --fg:#1d2a24; --muted:#5f6e66;
  --pine:#2f5d4a; --pine-soft:#e3eee8; --wood:#9a5b2e; --wood-soft:#f6ebe1;
  --rain:#3f6f9a; --rain-soft:#e4edf6; --cold:#5a6fa8;
  --display:"Young Serif", Georgia, serif; --body:"Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#18221d; --line:#2a3630; --fg:#e6ece8; --muted:#9aaaa1;
  --pine:#7fc0a2; --pine-soft:#1f3329; --wood:#e0a370; --wood-soft:#33261b;
  --rain:#8db7df; --rain-soft:#1b2a38; --cold:#a3b3e0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#18221d; --line:#2a3630; --fg:#e6ece8; --muted:#9aaaa1;
  --pine:#7fc0a2; --pine-soft:#1f3329; --wood:#e0a370; --wood-soft:#33261b;
  --rain:#8db7df; --rain-soft:#1b2a38; --cold:#a3b3e0; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;color:var(--pine);text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--fg)}
.tabs{display:flex;gap:4px;margin:24px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:600 14px var(--body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--pine);border-bottom-color:var(--pine)}
.tab:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.section{display:grid;gap:16px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-head{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.badge{flex:none;width:52px;height:52px;border-radius:12px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center;font:600 13px var(--body);text-align:center;line-height:1.1}
.badge b{display:block;font-family:var(--display);font-weight:400;font-size:20px}
.day-title{min-width:0}
.date{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.name{font-family:var(--display);font-size:20px;line-height:1.2}
.wx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;font-size:13px;font-variant-numeric:tabular-nums}
.wx .t{font-weight:600}
.pill{border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.pill.rain{background:var(--rain-soft);color:var(--rain)}
.pill.cold{background:var(--rain-soft);color:var(--cold)}
.timeline{list-style:none;margin:0;padding:16px 18px 6px 18px}
.tl{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl:last-child{border-left-color:transparent}
.tl::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--pine);border:2px solid var(--surface)}
.tl.food::before{background:var(--wood)}
.tl.tbc::before{background:var(--surface);border-color:var(--muted)}
.time{font-size:12px;font-weight:700;color:var(--pine);font-variant-numeric:tabular-nums}
.tl.food .time{color:var(--wood)}
.tl.tbc .time{color:var(--muted)}
.ttl{font-weight:600}
.desc{color:var(--muted);font-size:14px}
.tip{margin:0 18px 16px;background:var(--wood-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:14px}
.tip str
